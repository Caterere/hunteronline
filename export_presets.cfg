# Export presets for Hunter Online (Godot 4.6)
# Open Project → Export in the editor, or:
#   godot --headless --export-release "Windows Desktop" build/windows/HunterOnline.exe
#
# Requires export templates for 4.6 installed (Editor → Manage Export Templates).

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="scratch/*,docs/*,*.md,.git/*,.github/*"
export_path="build/windows/HunterOnline.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
architecture/x86_64=true
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name="Hunter Online"
application/product_name="Hunter Online"
application/file_description="Hunter Online — LAN Multiplayer"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

